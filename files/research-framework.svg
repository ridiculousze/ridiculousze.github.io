<svg xmlns="http://www.w3.org/2000/svg" width="740" height="280" viewBox="0 0 740 280" role="img" aria-labelledby="title desc">
<title id="title">Brain, cognition, and cultural processes</title>
<desc id="desc">A conceptual research framework linking neural mechanisms with internal mental models, including knowledge, beliefs, and values, and with cultural processes across historical time and societies. Paired arrows indicate reciprocal interactions.</desc>
<defs>
  <radialGradient id="brain-halo"><stop stop-color="#e9f0f5"/><stop offset="1" stop-color="#f7f9fb" stop-opacity="0"/></radialGradient>
  <radialGradient id="culture-halo"><stop stop-color="#f4eee6"/><stop offset="1" stop-color="#fbf9f6" stop-opacity="0"/></radialGradient>
  <linearGradient id="mind-fill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2f6f9"/><stop offset="1" stop-color="#faf9f6"/></linearGradient>
  <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L5.5 3.5 L1 6" fill="none" stroke="#9caab3" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs><style>
  text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #303b45; text-anchor: middle; }
  .label { font-size: 20px; font-weight: 500; letter-spacing: -.3px; }
  .sub { font-size: 13px; fill: #68727b; }
  .micro { font-size: 12px; fill: #68727b; }
  .line { fill: none; stroke: #67849a; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .connection { fill: none; stroke: #9caab3; stroke-width: 1.2; stroke-linecap: round; }
</style>

